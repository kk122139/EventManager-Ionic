<ion-header [translucent]="true">
  <ion-toolbar>

    <ion-back-button 
    defaultHref="/"
    text=""
    color="dark"
    slot="start">
    </ion-back-button>
  
    <ion-title>Iniciar Sesion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Iniciar Sesion</ion-title>
    </ion-toolbar>
  </ion-header>

  <div style="padding-top: 50px;" class="center pl pr">
    <img src="assets/duocuc.png" alt="">
  </div>

  <div style="padding-top: 50px; ">
    <ion-card>
      <ion-card-content>
        <form [formGroup]="loginForm">
          <ion-item>
            <ion-input type="text" placeholder="Ingrese su nombre de usuario" label="Nombre de usuario:" labelPlacement="floating"
                formControlName="username">
            </ion-input>
          </ion-item >
      
            <div id="alerta" *ngIf="loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty || 
                        loginForm.get('username')?.touched)">
              <div id="alerta" *ngIf="loginForm.get('username')?.hasError('required')">
                *Nombre de usuario obligatorio
              </div>
              <div id="alerta" *ngIf="loginForm.get('username')?.hasError('minlength')">
                *Nombre de usuario invalido, minimo 6 caracteres
              </div>
            </div>
      
          <ion-item>
            <ion-input type="password" placeholder="ingrese su contraseña" label="Contraseña:" labelPlacement="floating"
                formControlName="password">
            </ion-input>
          </ion-item>
      
          <div id="alerta" *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || 
                      loginForm.get('password')?.touched)">
            <div id="alerta" *ngIf="loginForm.get('password')?.hasError('required')">
              *Contraseña es obligatoria
            </div>
            <div id="alerta" *ngIf="loginForm.get('password')?.hasError('minlength')">
              *Contraseña invalida
            </div>
          </div>
          <ion-button routerLink="/forgot-password" fill="clear" shape="round"> ¿Has olvidado tu contraseña? </ion-button>

        </form>
      </ion-card-content>

      <div>
        <ion-button (click)="login()" [disabled]="!loginForm.valid"  expand="block" fill="solid" shape="round" color="tertiary" class="pb">
          Iniciar sesion
        </ion-button>
        <div style="text-align: center;">
          <ion-button (click)="Registrar()"  fill="clear" shape="round">
            Registrarse
          </ion-button>
        </div>
      </div>
    </ion-card>
    <br><br>
    <div style="text-align: start;">
    </div>
  </div>
  
</ion-content>

<ion-footer>
  <ion-toolbar class="footer" >
    <ion-title slot="start" style="text-align: start;" style="font-weight: 700;">Duoc UC</ion-title>
    <ion-buttons slot="end">

      <ion-button fill="clear">
        <ion-icon name="logo-instagram" color="light"></ion-icon>
      </ion-button>

      <ion-button fill="clear">
        <ion-icon name="logo-github" color="light"></ion-icon>
      </ion-button>

      <ion-button fill="clear">
        <ion-icon name="logo-youtube" color="light"></ion-icon>
      </ion-button>


    </ion-buttons>

  </ion-toolbar>
</ion-footer>
