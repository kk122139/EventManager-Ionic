<ion-app>

  <ion-menu contentId="main" menuId="first" side="start" type="overlay">
    <ion-header>
      <ion-toolbar color="tertiary">
        <ion-icon slot="start" name="people-circle-outline" size="large" style="padding-left: 10px;"></ion-icon>
        <ion-title>EventManager</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list lines="none">
        <ion-menu-toggle *ngFor="let m of menu">
           <ion-item [routerLink]="m.redirecTo" detail="true">
             <ion-icon slot="start" [name]="m.icon" color="dark"></ion-icon>
             <ion-label>{{m.name}}</ion-label>
           </ion-item>
        </ion-menu-toggle>
      </ion-list>
      <ion-item class="list" button (click)="logOut()" >
        <ion-icon slot="start" name="exit-outline"></ion-icon>
          <ion-label>Cerrar sesion</ion-label>
      </ion-item>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
