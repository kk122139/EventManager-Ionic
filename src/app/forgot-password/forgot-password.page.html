<ion-header>
  <ion-toolbar>
    <ion-back-button
      defaultHref="/login"
      text=""
      color="dark"
      slot="start">
    </ion-back-button>
    <ion-title>Recuperar Contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="recoverForm" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input
        type="email"
        inputmode="email"
        autocomplete="email"
        formControlName="email">
      </ion-input>
    </ion-item>

    <div *ngIf="recoverForm.get('email')?.invalid && recoverForm.get('email')?.touched">
      <ion-text color="danger">
        <p>* Ingresa un correo electrónico válido.</p>
      </ion-text>
    </div>

    <ion-button
      type="submit"
      expand="block"
      class="ion-margin-top"
      [disabled]="recoverForm.invalid || enviando">
      <ion-spinner *ngIf="enviando" name="crescent" class="button-spinner"></ion-spinner>
      <span>{{ enviando ? 'Enviando...' : 'Enviar correo' }}</span>
    </ion-button>

    <ion-card *ngIf="estado !== 'idle'" [color]="estado === 'success' ? 'success' : 'danger'">
      <ion-card-content>
        {{ mensaje }}
      </ion-card-content>
    </ion-card>

    <ion-button routerLink="/reset-password" fill="clear" expand="block">
      Ya tengo un token
    </ion-button>
  </form>
</ion-content>
